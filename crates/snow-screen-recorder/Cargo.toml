[package]
name = "snow-screen-recorder"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
snow-capture = { path = "../snow-capture" }
snow-audio-recorder = { path = "../snow-audio-recorder" }
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
bincode = "1.3.3"
zstd = "0.13.3"
ffmpeg-next = "8.0.0"
uuid = { version = "1.18.1", features = ["v4"] }
crossbeam-channel = "0.5.15"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
