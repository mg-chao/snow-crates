[workspace]
members = [
    "crates/snow-core",
    "crates/snow-capture",
    "crates/snow-audio-recorder",
    "crates/snow-screen-recorder",
    "crates/snow-cursor-capture",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
half = "2.7.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
rayon = "1.11.0"
rustc-hash = "2.1.1"
tokio = { version = "1.49.0", default-features = false }
windows = "0.62.2"
windows-core = "0.62.2"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.dev]
incremental = false
